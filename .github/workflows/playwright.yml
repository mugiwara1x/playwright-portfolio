name: Playwright tests

on:
  push:
  pull_request:
  # Adds a "Run workflow" button in the Actions tab.
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that's still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, browser-free checks first. If these fail there's no point running browsers.
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # The same suite split across machines. Each shard runs a slice of the tests in parallel.
  test:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish even if one fails, so the merged report shows ALL failures.
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --with-deps also installs the Linux system libraries Chromium needs.
      - run: npx playwright install --with-deps chromium
      - name: Run shard ${{ matrix.shardIndex }} of ${{ matrix.shardTotal }}
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # Raw results for the merge job. `!cancelled()` = upload even when tests failed.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

      # Traces, screenshots and visual diffs of failed tests, as plain files.
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: test-results
          retention-days: 7

  # Combines every shard's blob into a single HTML report (traces included).
  merge-reports:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
